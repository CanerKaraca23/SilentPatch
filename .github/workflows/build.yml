name: Build SilentPatch

on:
  push:
    branches: test
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '66c0373dc7fca549e5803087b9487edfe3aca0a1'

      - name: Setup RenderWare SDK
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/DK22Pac/plugin-sdk.git $env:RUNNER_TEMP\plugin-sdk
          git -C "$env:RUNNER_TEMP\plugin-sdk" sparse-checkout set plugin_III/game_III/rw plugin_vc/game_vc/rw plugin_sa/game_sa/rw

          $sdk = "$env:RUNNER_TEMP\plugin-sdk"
          $games = @(
            @{ Dir='III'; Src='plugin_III/game_III'; Api='d3d8' },
            @{ Dir='VC';  Src='plugin_vc/game_vc';   Api='d3d8' },
            @{ Dir='SA';  Src='plugin_sa/game_sa';   Api='d3d9' }
          )
          foreach ($g in $games) {
            $dst = "rwsdk\$($g.Dir)\include\$($g.Api)"
            New-Item -ItemType Directory -Force -Path "$dst\rw" | Out-Null
            Copy-Item "$sdk\$($g.Src)\rw\*" "$dst\"
            Copy-Item "$sdk\$($g.Src)\rw\*.rpe" "$dst\rw\"
          }

          # Fix plugin-sdk headers for MSVC compatibility
          foreach ($g in $games) {
            $dst = "rwsdk\$($g.Dir)\include\$($g.Api)"
            (Get-Content "$dst\rwplcore.h") -replace 'extern void         \*&RwEngineInstance;', 'extern void         *RwEngineInstance;' | Set-Content "$dst\rwplcore.h"
          }
          (Get-Content rwsdk\SA\include\d3d9\rtanim.h) -replace '//RwInt32                             animKeyFrameSize;', 'RwInt32                             animKeyFrameSize;' | Set-Content rwsdk\SA\include\d3d9\rtanim.h

          $root = (Resolve-Path rwsdk).Path
          echo "RWG33SDK=$root\III" >> $env:GITHUB_ENV
          echo "RWG34SDK=$root\VC" >> $env:GITHUB_ENV
          echo "RWG36SDK=$root\SA" >> $env:GITHUB_ENV

      - name: Resolve VS install path
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          echo "VS_INSTALL_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Cache v141_xp toolset
        id: cache-v141xp
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VS_INSTALL_PATH }}\VC\Tools\MSVC\14.16.27023
            ${{ env.VS_INSTALL_PATH }}\MSBuild\Microsoft\VC\v170\Platforms\Win32\PlatformToolsets\v141_xp
            ${{ env.VS_INSTALL_PATH }}\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets\v141_xp
            C:\Program Files (x86)\Microsoft SDKs\Windows\v7.1A
          key: v141xp-${{ runner.os }}-${{ env.ImageVersion }}-14.16.27023

      - name: Install v141_xp toolset
        if: steps.cache-v141xp.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-Location "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\"
          $InstallPath = $env:VS_INSTALL_PATH
          $Arguments = ('/c', 'vs_installer.exe', 'modify', '--installPath', "`"$InstallPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.WinXP',
            '--quiet', '--norestart', '--nocache')
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "vs_installer.exe modify failed with exit code $($process.ExitCode) on first attempt."
            exit 1
          }
          # NOTE: On GitHub-hosted Windows runners the v141_xp toolset does not fully register
          # after a single installer run. Running the same command a second time is required
          # to complete registration, so do not simplify this back to a single invocation.
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "vs_installer.exe modify failed with exit code $($process.ExitCode) on first attempt."
            exit 1
          }
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Write-Error "vs_installer.exe modify failed with exit code $($process.ExitCode) on second attempt."
            exit 1
          }
          if ($process.ExitCode -ne 0) {
            Write-Error "vs_installer.exe modify failed with exit code $($process.ExitCode) on second attempt."
            exit 1
          }

      - name: Build
        run: |
          vcpkg integrate install
          msbuild SilentPatch.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Copy INI files to Release
        shell: pwsh
        run: |
            Copy-Item Config/SilentPatchIII.ini Release/SilentPatchIII.ini
            Copy-Item Config/SilentPatchVC.ini Release/SilentPatchVC.ini
            Copy-Item Config/SilentPatchSA.ini Release/SilentPatchSA.ini

      - name: Upload SilentPatchIII
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchIII
          path: |
            Release/SilentPatchIII.asi
            Release/SilentPatchIII.ini

      - name: Upload SilentPatchVC
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchVC
          path: |
            Release/SilentPatchVC.asi
            Release/SilentPatchVC.ini

      - name: Upload SilentPatchSA
        uses: actions/upload-artifact@v7
        with:
          name: SilentPatchSA
          path: |
            Release/SilentPatchSA.asi
            Release/SilentPatchSA.ini

      - name: Upload DDraw
        uses: actions/upload-artifact@v7
        with:
          name: DDraw
          path: Release/ddraw.dll
